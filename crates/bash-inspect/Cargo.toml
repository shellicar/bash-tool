[package]
name = "bash-inspect"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

# The middle of three phases: parse, inspect, walk. Takes the tree bash-parser
# produced and reports which constructs the walker cannot execute. It only
# reports — the binary composes the phases and decides. Whether execution goes
# ahead is the caller's, and it asks before any of the script runs, because a
# construct refused mid-walk has already let everything above it take effect
# (CLAUDE.md, "Unsupported constructs are refused by static inspection").
#
# It depends on bash-parser for the AST alone, and never calls parse().
[dependencies]
bash-parser = { path = "../bash-parser" }
